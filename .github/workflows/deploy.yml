name: Deploy to GitHub Pages

# Lancer la publication après un envoi sur main ou manuellement depuis GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Donner à cette exécution le droit de lire le dépôt et de publier sur GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois. Laisser celle qui a démarré aller jusqu’au bout.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Première partie : fabriquer les fichiers du site sur une machine Linux de GitHub.
  build:
    runs-on: ubuntu-latest
    
    steps:
      # Récupérer le code du commit, préparer Node.js, puis installer les bibliothèques.
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      # npm ci utilise les versions exactes notées dans package-lock.json.
      - name: Install dependencies
        run: npm ci
        
      # Construire le site dans dist et indiquer le nom du dépôt pour que les fichiers aient la bonne adresse.
      - name: Build project
        run: npm run build
        env:
          VITE_BASE_URL: /${{ github.event.repository.name }}/
        
      # Préparer la redirection des anciennes adresses du site.
      - name: Keep existing page links working
        run: node scripts/create-pages-redirects.mjs
        env:
          VITE_BASE_URL: /${{ github.event.repository.name }}/

      # Préparer GitHub Pages et transmettre dist à la deuxième partie.
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Deuxième partie : publier le site construit et récupérer son adresse publique.
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Attendre que la construction soit terminée avec succès.
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
